#
# AetherOS pacman.conf (used by mkarchiso while building the ISO)
#
[options]
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Uncomment if you need 32-bit libraries (Wine, Steam, etc.)
#[multilib]
#Include = /etc/pacman.d/mirrorlist

# calamares and arc-gtk-theme are no longer in the official Arch repos
# (AUR-only nowadays); Chaotic-AUR provides ready-built binaries for them
# so the build doesn't have to compile from source. The matching keyring/
# mirrorlist are installed on the build host by build.sh before mkarchiso runs.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
